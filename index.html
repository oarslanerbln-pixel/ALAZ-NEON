<!doctype html>
<!--
  lang="de": Berlin'deki asıl pazar Almanya olduğu için i18n.ts'teki
  DEFAULT_LOCALE de "de" — bu statik öznitelik JS yüklenmeden önceki o kısa
  an için onunla eşleşiyor (ekran okuyucu/SEO). Arayüz büyük harf ağırlıklı
  ve CSS `text-transform: uppercase` dil kuralına göre çalışıyor — bu yüzden
  "tr" değil spesifik bir dil kodu gerekiyor (lang="en" iken "Giriş" →
  "GIRIŞ" oluyordu, noktasız I). Dil değiştirildiğinde useLocale/setLocale
  bu değeri anında günceller (bkz. i18n.ts).
-->
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="apple-touch-icon" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#030305" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>HEGAME</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

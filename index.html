<!doctype html>
<!--
  lang="tr" bilinçli bir tercih: arayüz büyük harf ağırlıklı ve CSS
  `text-transform: uppercase` dil kuralına göre çalışıyor. lang="en" iken
  "Giriş" → "GIRIŞ" oluyordu (noktasız I); Türkçede doğrusu "GİRİŞ".
  Dil değiştirildiğinde useLocale bu değeri günceller.
-->
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="apple-touch-icon" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#030305" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>HEGAME</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
